name: Jack Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Comprobaciones del núcleo
        run: dotnet run --project Windows/Jack.Core.Checks

      - name: Publicar Jack.WinUI (x64)
        run: dotnet publish Windows/Jack.WinUI -c Release -p:Platform=x64 -o out

      - name: Abrir la app y capturar pantalla
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($c in @(@('empty','light'), @('demo','light'), @('demo','dark'))) {
            $env:JACK_CAPTURE = $c[0]; $env:JACK_THEME = $c[1]
            $since = Get-Date
            $app = Start-Process out/Jack.WinUI.exe -PassThru
            Start-Sleep -Seconds 12
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/$($c[0])-$($c[1]).png")
            if ($app.HasExited) {
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$since} -ErrorAction SilentlyContinue |
                Where-Object { $_.Message -match 'Jack' } | ForEach-Object { $_.Message } | Out-File events.txt
              Get-Content events.txt
              if (Test-Path out/crash.log) { Copy-Item out/crash.log crash.log; Get-Content crash.log }
              throw "Jack.WinUI se cerró con código $($app.ExitCode)"
            }
            Stop-Process $app
          }

      - name: Comprimir la app
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath Jack-windows-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: jack-windows-x64
          path: Jack-windows-x64.zip
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jack-windows
          path: |
            *.png
            events.txt
            crash.log
          if-no-files-found: ignore
