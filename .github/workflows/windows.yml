name: Jack Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Comprobaciones del núcleo
        run: dotnet run --project Windows/Jack.Core.Checks

      - name: Publicar Jack.WinUI (x64)
        run: dotnet publish Windows/Jack.WinUI -c Release -p:Platform=x64 -o out

      - name: Abrir la app y capturar pantalla
        shell: pwsh
        run: |
          $app = Start-Process out/Jack.WinUI.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Jack.WinUI se cerró con código $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/screenshot.png")
          Stop-Process $app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jack-windows
          path: |
            screenshot.png
            out/
